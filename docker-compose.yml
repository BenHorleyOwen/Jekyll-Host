
services:
  jekyll:
    image: jekyll/jekyll:latest
    working_dir: /srv/jekyll

    command: >
      sh -c 'bundle install &&
      bundle exec jekyll serve --livereload --host 0.0.0.0'

    ports:
      - "4000:4000"
      - "35729:35729"

    volumes:
      - ${SITE_DIR}:/srv/jekyll
      - jekyll_gems:/usr/gem

volumes:
  jekyll_gems:
